AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Education institute knowledge base (RAG). Upload PDF, Word, Excel, CSV, PowerPoint, HTML,
  text files and web links; users ask questions and get cited answers, downloads and summaries.
  Serverless: CloudFront + S3, Cognito, API Gateway HTTP API, Lambda, SQS, DynamoDB,
  Amazon S3 Vectors and Amazon Bedrock. Package code first with cloudformation/package.sh.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Institute }
        Parameters: [InstituteName, AdminEmail, AllowSelfSignUp]
      - Label: { default: Code artifacts (from package.sh) }
        Parameters: [ArtifactBucket, ArtifactPrefix]
      - Label: { default: AI models (Amazon Bedrock) }
        Parameters: [ChatModelId, EmbedModelId]
      - Label: { default: Import from existing DynamoDB tables }
        Parameters: [SourceTables]
      - Label: { default: Token usage limits }
        Parameters: [AnswerMaxTokens, SummaryMaxTokens, SummarizeOnIngest]
      - Label: { default: Advanced }
        Parameters: [CognitoDomainPrefix, MaxUploadMb, IngestConcurrency, LogRetentionDays]

Parameters:
  InstituteName:
    Type: String
    Default: Your Institute
    MinLength: 1
    MaxLength: 100
    Description: Shown in the UI and used in AI prompts.
  AdminEmail:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[^@\s]+@[^@\s]+\.[^@\s]+$'
    ConstraintDescription: Must be a valid email address or empty.
    Description: Optional. Creates this user in the "admins" group; Cognito emails a temporary password.
  AllowSelfSignUp:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Let students/staff register themselves. If false, admins create users in Cognito.
  ArtifactBucket:
    Type: String
    AllowedPattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
    Description: S3 bucket (same region) holding api.zip, ingest.zip, cfn-site.zip and frontend.zip.
  ArtifactPrefix:
    Type: String
    AllowedPattern: '^([A-Za-z0-9._-]+/)*$'
    ConstraintDescription: Must be empty or end with "/".
    Description: Key prefix of the artifacts, e.g. edu-kb/20261029120000/ (printed by package.sh).
  ChatModelId:
    Type: String
    Default: global.anthropic.claude-sonnet-4-6
    Description: Bedrock model or inference profile ID used for answers and summaries.
  EmbedModelId:
    Type: String
    Default: amazon.titan-embed-text-v2:0
    AllowedValues: [amazon.titan-embed-text-v2:0]
    Description: Embedding model (the vector index is 1024 dimensions, cosine).
  SourceTables:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[A-Za-z0-9_.-]{3,255}(,[A-Za-z0-9_.-]{3,255})*$'
    ConstraintDescription: Comma-separated DynamoDB table names, no spaces (e.g. Courses,Faculty).
    Description: >-
      Existing DynamoDB tables (same account and region) that admins may import into the knowledge base
      with an on-demand "Import"/"Sync now" button. Read-only access (Scan, DescribeTable) is granted to
      these tables only. Leave empty to disable.
  AnswerMaxTokens:
    Type: Number
    Default: 600
    MinValue: 100
    MaxValue: 4096
    Description: Max output tokens per answer (~0.75 words/token). The assistant is also told to aim for ~40% of this.
  SummaryMaxTokens:
    Type: Number
    Default: 400
    MinValue: 100
    MaxValue: 2048
    Description: Max output tokens per document summary.
  SummarizeOnIngest:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: 'true = summarise every document when added; false = only when a user clicks Summary (saves tokens).'
  CognitoDomainPrefix:
    Type: String
    Default: edu-kb
    AllowedPattern: '^[a-z0-9](?:[a-z0-9-]{0,40}[a-z0-9])?$'
    Description: Hosted sign-in domain prefix; the account ID is appended to keep it unique.
  MaxUploadMb:
    Type: Number
    Default: 50
    MinValue: 1
    MaxValue: 500
    Description: Maximum size of an uploaded file.
  IngestConcurrency:
    Type: Number
    Default: 5
    MinValue: 2
    MaxValue: 50
    Description: Maximum documents processed in parallel (protects Bedrock quotas).
  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [7, 14, 30, 60, 90, 180, 365]

Conditions:
  HasAdmin: !Not [!Equals [!Ref AdminEmail, '']]
  SelfSignUp: !Equals [!Ref AllowSelfSignUp, 'true']
  HasSourceTables: !Not [!Equals [!Ref SourceTables, '']]

Resources:
  # ------------------------------------------------------------------ Website hosting
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [!GetAtt SiteBucket.Arn, !Sub '${SiteBucket.Arn}/*']
            Condition: { Bool: { aws:SecureTransport: 'false' } }

  SiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-site-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub '${InstituteName} knowledge base'
        DefaultRootObject: index.html
        HttpVersion: http2and3
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOriginAccessControl.Id
            S3OriginConfig: { OriginAccessIdentity: '' }
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6          # Managed-CachingOptimized
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # Managed-SecurityHeadersPolicy
        CustomErrorResponses:
          # Single-page app: unknown paths serve index.html
          - { ErrorCode: 403, ResponseCode: 200, ResponsePagePath: /index.html, ErrorCachingMinTTL: 0 }
          - { ErrorCode: 404, ResponseCode: 200, ResponsePagePath: /index.html, ErrorCachingMinTTL: 0 }

  # ------------------------------------------------------------------ Document storage
  DocumentsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    DependsOn: IngestQueuePolicy
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [POST]
            AllowedOrigins: [!Sub 'https://${Distribution.DomainName}', 'http://localhost:5173']
            AllowedHeaders: ['*']
            MaxAge: 3600
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 1 }
      NotificationConfiguration:
        QueueConfigurations:
          - Event: s3:ObjectCreated:*
            Queue: !GetAtt IngestQueue.Arn
            Filter:
              S3Key:
                Rules: [{ Name: prefix, Value: uploads/ }]

  DocumentsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DocumentsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [!GetAtt DocumentsBucket.Arn, !Sub '${DocumentsBucket.Arn}/*']
            Condition: { Bool: { aws:SecureTransport: 'false' } }

  # ------------------------------------------------------------------ Metadata (DynamoDB)
  DocumentsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: id, AttributeType: S }
        - { AttributeName: gsiPk, AttributeType: S }
        - { AttributeName: createdAt, AttributeType: S }
      KeySchema:
        - { AttributeName: id, KeyType: HASH }
      GlobalSecondaryIndexes:
        - IndexName: byCreated
          KeySchema:
            - { AttributeName: gsiPk, KeyType: HASH }
            - { AttributeName: createdAt, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }

  # ------------------------------------------------------------------ Embeddings (S3 Vectors)
  VectorBucket:
    Type: AWS::S3Vectors::VectorBucket
    DeletionPolicy: Retain          # a vector bucket must be empty before it can be deleted
    UpdateReplacePolicy: Retain

  VectorIndex:
    Type: AWS::S3Vectors::Index
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      VectorBucketArn: !Ref VectorBucket
      IndexName: chunks
      DataType: float32
      Dimension: 1024
      DistanceMetric: cosine
      MetadataConfiguration:
        # Passage text is returned with results but never filtered on (allows up to 40 KB).
        NonFilterableMetadataKeys: [content, heading, page]

  # ------------------------------------------------------------------ Ingestion queue
  IngestDLQ:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  IngestQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 3600          # >= 6x ingest Lambda timeout
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt IngestDLQ.Arn
        maxReceiveCount: 3

  IngestQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref IngestQueue]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowS3Notifications
            Effect: Allow
            Principal: { Service: s3.amazonaws.com }
            Action: sqs:SendMessage
            Resource: !GetAtt IngestQueue.Arn
            Condition:
              StringEquals: { aws:SourceAccount: !Ref AWS::AccountId }
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 'sqs:*'
            Resource: !GetAtt IngestQueue.Arn
            Condition: { Bool: { aws:SecureTransport: 'false' } }

  # ------------------------------------------------------------------ IAM
  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: api
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:Query, dynamodb:BatchGetItem]
                Resource: [!GetAtt DocumentsTable.Arn, !Sub '${DocumentsTable.Arn}/index/*']
              - Effect: Allow
                Action: [s3vectors:QueryVectors, s3vectors:GetVectors, s3vectors:DeleteVectors]
                Resource: !GetAtt VectorIndex.IndexArn
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub '${DocumentsBucket.Arn}/*'
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt DocumentsBucket.Arn
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt IngestQueue.Arn
              # Validate an import request (table exists + readable). Read-only.
              - !If
                - HasSourceTables
                - Effect: Allow
                  Action: dynamodb:DescribeTable
                  Resource: !Split [',', !Join ['', ['arn:*:dynamodb:*:*:table/', !Join [',arn:*:dynamodb:*:*:table/', !Split [',', !Ref SourceTables]]]]]
                  Condition:
                    StringEquals:
                      aws:ResourceAccount: !Ref AWS::AccountId
                      aws:RequestedRegion: !Ref AWS::Region
                - !Ref AWS::NoValue
              - Effect: Allow
                Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
                Resource:
                  - !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${EmbedModelId}'
                  # Global/cross-region inference profiles route to the model in any region.
                  - !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${ChatModelId}'
                  - !Sub 'arn:${AWS::Partition}:bedrock:*::foundation-model/*'
                  - !Sub 'arn:${AWS::Partition}:bedrock:::foundation-model/*'

  IngestRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: ingest
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:UpdateItem]
                Resource: !GetAtt DocumentsTable.Arn
              - Effect: Allow
                Action: [s3vectors:PutVectors, s3vectors:DeleteVectors, s3vectors:GetVectors]
                Resource: !GetAtt VectorIndex.IndexArn
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub '${DocumentsBucket.Arn}/*'
              # CSV snapshots of imported DynamoDB tables (outside uploads/, so no re-trigger).
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub '${DocumentsBucket.Arn}/snapshots/*'
              # One-off, on-demand read of the allow-listed source tables. Read-only.
              - !If
                - HasSourceTables
                - Effect: Allow
                  Action: [dynamodb:Scan, dynamodb:DescribeTable]
                  Resource: !Split [',', !Join ['', ['arn:*:dynamodb:*:*:table/', !Join [',arn:*:dynamodb:*:*:table/', !Split [',', !Ref SourceTables]]]]]
                  Condition:
                    StringEquals:
                      aws:ResourceAccount: !Ref AWS::AccountId
                      aws:RequestedRegion: !Ref AWS::Region
                - !Ref AWS::NoValue
              - Effect: Allow
                Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes, sqs:ChangeMessageVisibility]
                Resource: !GetAtt IngestQueue.Arn
              - Effect: Allow
                Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
                Resource:
                  - !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${EmbedModelId}'
                  - !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${ChatModelId}'
                  - !Sub 'arn:${AWS::Partition}:bedrock:*::foundation-model/*'
                  - !Sub 'arn:${AWS::Partition}:bedrock:::foundation-model/*'

  SiteDeployerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: site-deployer
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${ArtifactBucket}/${ArtifactPrefix}frontend.zip'
              - Effect: Allow
                Action: [s3:PutObject, s3:DeleteObject]
                Resource: !Sub '${SiteBucket.Arn}/*'
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt SiteBucket.Arn
              - Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

  # ------------------------------------------------------------------ Lambda functions
  ApiLogs:
    Type: AWS::Logs::LogGroup
    Properties: { RetentionInDays: !Ref LogRetentionDays }
  IngestLogs:
    Type: AWS::Logs::LogGroup
    Properties: { RetentionInDays: !Ref LogRetentionDays }
  SiteDeployerLogs:
    Type: AWS::Logs::LogGroup
    Properties: { RetentionInDays: !Ref LogRetentionDays }

  ApiFunction:
    Type: AWS::Lambda::Function
    Properties:
      Description: Knowledge base REST API (ask, library, admin)
      Runtime: nodejs24.x
      Architectures: [arm64]
      Handler: index.handler
      MemorySize: 1024
      Timeout: 29
      Role: !GetAtt ApiRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub '${ArtifactPrefix}api.zip'
      LoggingConfig: { LogGroup: !Ref ApiLogs }
      Environment:
        Variables:
          DOCUMENTS_TABLE: !Ref DocumentsTable
          VECTOR_INDEX_ARN: !GetAtt VectorIndex.IndexArn
          BUCKET: !Ref DocumentsBucket
          QUEUE_URL: !Ref IngestQueue
          EMBED_MODEL_ID: !Ref EmbedModelId
          CHAT_MODEL_ID: !Ref ChatModelId
          INSTITUTE_NAME: !Ref InstituteName
          MAX_UPLOAD_MB: !Ref MaxUploadMb
          ALLOWED_SOURCE_TABLES: !Ref SourceTables
          ANSWER_MAX_TOKENS: !Ref AnswerMaxTokens
          SUMMARY_MAX_TOKENS: !Ref SummaryMaxTokens
          NODE_OPTIONS: --enable-source-maps

  IngestFunction:
    Type: AWS::Lambda::Function
    Properties:
      Description: Extracts, chunks, embeds and summarises documents
      Runtime: nodejs24.x
      Architectures: [arm64]
      Handler: index.handler
      MemorySize: 2048
      Timeout: 600
      Role: !GetAtt IngestRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub '${ArtifactPrefix}ingest.zip'
      LoggingConfig: { LogGroup: !Ref IngestLogs }
      Environment:
        Variables:
          DOCUMENTS_TABLE: !Ref DocumentsTable
          VECTOR_INDEX_ARN: !GetAtt VectorIndex.IndexArn
          BUCKET: !Ref DocumentsBucket
          EMBED_MODEL_ID: !Ref EmbedModelId
          CHAT_MODEL_ID: !Ref ChatModelId
          INSTITUTE_NAME: !Ref InstituteName
          SUMMARY_MAX_TOKENS: !Ref SummaryMaxTokens
          SUMMARIZE_ON_INGEST: !Ref SummarizeOnIngest
          ALLOWED_SOURCE_TABLES: !Ref SourceTables
          NODE_OPTIONS: --enable-source-maps

  IngestEventSource:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt IngestQueue.Arn
      FunctionName: !Ref IngestFunction
      BatchSize: 1
      FunctionResponseTypes: [ReportBatchItemFailures]
      ScalingConfig: { MaximumConcurrency: !Ref IngestConcurrency }

  SiteDeployerFunction:
    Type: AWS::Lambda::Function
    Properties:
      Description: Publishes the web app and runtime config.json to the site bucket
      Runtime: nodejs24.x
      Architectures: [arm64]
      Handler: index.handler
      MemorySize: 512
      Timeout: 300
      Role: !GetAtt SiteDeployerRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub '${ArtifactPrefix}cfn-site.zip'
      LoggingConfig: { LogGroup: !Ref SiteDeployerLogs }

  # ------------------------------------------------------------------ Auth (Cognito)
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub '${AWS::StackName}-users'
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: !If [SelfSignUp, false, true]
      Schema:
        - { Name: email, AttributeDataType: String, Required: true, Mutable: true }
        - { Name: name, AttributeDataType: String, Required: false, Mutable: true }
      Policies:
        PasswordPolicy:
          MinimumLength: 10
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
      AccountRecoverySetting:
        RecoveryMechanisms: [{ Name: verified_email, Priority: 1 }]

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Sub '${CognitoDomainPrefix}-${AWS::AccountId}'

  WebClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      SupportedIdentityProviders: [COGNITO]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      CallbackURLs: [!Sub 'https://${Distribution.DomainName}/', 'http://localhost:5173/']
      LogoutURLs: [!Sub 'https://${Distribution.DomainName}/', 'http://localhost:5173/']
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits: { AccessToken: hours, IdToken: hours, RefreshToken: days }

  AdminsGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: admins
      Description: Staff who can upload, link, edit and delete knowledge base content

  InitialAdmin:
    Type: AWS::Cognito::UserPoolUser
    Condition: HasAdmin
    Properties:
      UserPoolId: !Ref UserPool
      Username: !Ref AdminEmail
      DesiredDeliveryMediums: [EMAIL]
      UserAttributes:
        - { Name: email, Value: !Ref AdminEmail }
        - { Name: email_verified, Value: 'true' }

  InitialAdminGroup:
    Type: AWS::Cognito::UserPoolUserToGroupAttachment
    Condition: HasAdmin
    DependsOn: [InitialAdmin, AdminsGroup]
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: admins
      Username: !Ref AdminEmail

  # ------------------------------------------------------------------ API (HTTP API + JWT)
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${AWS::StackName}-api'
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: [!Sub 'https://${Distribution.DomainName}', 'http://localhost:5173']
        AllowHeaders: [authorization, content-type]
        AllowMethods: [GET, POST, PATCH, DELETE, OPTIONS]
        MaxAge: 3600

  HttpApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 20

  JwtAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref HttpApi
      Name: cognito
      AuthorizerType: JWT
      IdentitySource: [$request.header.Authorization]
      JwtConfiguration:
        Audience: [!Ref WebClient]
        Issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'

  ApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ApiFunction.Arn
      PayloadFormatVersion: '2.0'

  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ApiFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*'

  # Every route requires a valid Cognito access token (JWT authorizer).
  RouteMe:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref HttpApi, RouteKey: GET /api/me, AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer, Target: !Sub 'integrations/${ApiIntegration}' }
  RouteCategories:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref HttpApi, RouteKey: GET /api/categories, AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer, Target: !Sub 'integrations/${ApiIntegration}' }
  RouteListDocuments:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref HttpApi, RouteKey: GET /api/documents, AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer, Target: !Sub 'integrations/${ApiIntegration}' }
  RouteGetDocument:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref HttpApi, RouteKey: 'GET /api/documents/{id}', AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer, Target: !Sub 'integrations/${ApiIntegration}' }
  RoutePatchDocument:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref HttpApi, RouteKey: 'PATCH /api/documents/{id}', AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer, Target: !Sub 'integrations/${ApiIntegration}' }
  RouteDeleteDocument:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref HttpApi, RouteKey: 'DELETE /api/documents/{id}', AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer, Target: !Sub 'integrations/${ApiIntegration}' }
  RouteDownload:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref HttpApi, RouteKey: 'GET /api/documents/{id}/download', AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer, Target: !Sub 'integrations/${ApiIntegration}' }
  RouteSummary:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref HttpApi, RouteKey: 'POST /api/documents/{id}/summary', AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer, Target: !Sub 'integrations/${ApiIntegration}' }
  RouteReindex:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref HttpApi, RouteKey: 'POST /api/documents/{id}/reindex', AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer, Target: !Sub 'integrations/${ApiIntegration}' }
  RouteUpload:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref HttpApi, RouteKey: POST /api/documents/upload, AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer, Target: !Sub 'integrations/${ApiIntegration}' }
  RouteLinks:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref HttpApi, RouteKey: POST /api/documents/links, AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer, Target: !Sub 'integrations/${ApiIntegration}' }
  RouteImportDynamo:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref HttpApi, RouteKey: POST /api/documents/dynamodb, AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer, Target: !Sub 'integrations/${ApiIntegration}' }
  RouteAsk:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref HttpApi, RouteKey: POST /api/ask, AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer, Target: !Sub 'integrations/${ApiIntegration}' }

  # ------------------------------------------------------------------ Publish the web app
  SiteDeployment:
    Type: Custom::SiteDeployment
    DependsOn: [SiteBucketPolicy, SiteDeployerLogs]
    Properties:
      ServiceToken: !GetAtt SiteDeployerFunction.Arn
      ArtifactBucket: !Ref ArtifactBucket
      FrontendKey: !Sub '${ArtifactPrefix}frontend.zip'
      SiteBucket: !Ref SiteBucket
      DistributionId: !Ref Distribution
      # Written to /config.json for the web app.
      Config:
        apiUrl: !GetAtt HttpApi.ApiEndpoint
        region: !Ref AWS::Region
        userPoolId: !Ref UserPool
        clientId: !Ref WebClient
        cognitoDomain: !Sub 'https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com'
        instituteName: !Ref InstituteName

Outputs:
  SiteUrl:
    Description: Open this URL to use the knowledge base
    Value: !Sub 'https://${Distribution.DomainName}'
  ApiUrl:
    Value: !GetAtt HttpApi.ApiEndpoint
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref WebClient
  CognitoDomain:
    Value: !Sub 'https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com'
  DocumentsBucketName:
    Value: !Ref DocumentsBucket
  DocumentsTableName:
    Value: !Ref DocumentsTable
  VectorIndexArn:
    Value: !GetAtt VectorIndex.IndexArn
  IngestDeadLetterQueueUrl:
    Value: !Ref IngestDLQ
